<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>יצירת קשר</title>
    <link rel="stylesheet" href="src/css/contact-page.css">
    <style>
      html.passage-cover, html.passage-cover body { background: #ffffff; }
      html.passage-cover body { visibility: hidden; }
    </style>
    <script>
      try {
        if (sessionStorage.getItem('portfolio-contact-arrive') === '1') {
          document.documentElement.className = 'passage-cover';
        }
      } catch (error) {}
    </script>
  </head>
  <body>
    <main class="sheet-scene">
      <article class="sheet">
        <div class="sheet__grain" aria-hidden="true"></div>
        <h1>יצירת קשר</h1>
        <p class="sheet__lead">יש לכם רעיון, שאלה או משהו מטורף בראש?</p>
        <p class="sheet__note">כתבו לי ואחזור אליכם בהקדם.</p>
        <div class="sheet__rule" aria-hidden="true"></div>
        <form data-plain-form action="" method="post">
          <label for="full-name">שם מלא *</label>
          <input id="full-name" name="name" type="text" required autocomplete="name" placeholder="השם שלכם">

          <label for="email">כתובת אימייל *</label>
          <input id="email" name="email" type="email" required autocomplete="email" placeholder="האימייל שלכם">

          <label for="phone">מספר טלפון</label>
          <input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="הטלפון שלכם">

          <label for="project">סוג הפרויקט *</label>
          <input id="project" name="project" type="text" required autocomplete="off" placeholder="כתבו בחופשיות">

          <label for="message">הודעה חופשית *</label>
          <textarea id="message" name="message" required placeholder="כתבו לי מה בראש"></textarea>

          <button type="submit">שליחת ההודעה</button>
        </form>
        <p data-plain-error hidden></p>
      </article>
    </main>
    <script type="module" src="src/js/contact-form.js"></script>
  </body>
</html>
