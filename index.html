<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#ffffff">
    <title>Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/css/style.css">
  </head>
  <body>
    <main
      id="experience"
      class="experience"
      data-phase="loading"
      data-mode="opening"
      data-scroll-offset="0"
      data-progress="0"
    >
      <!-- Three.js chaos scene mounts here and is revealed inside the black circle. -->
      <div class="experience__viewport" data-stage-mount data-scene="pending" aria-hidden="true">
        <div class="experience__backdrop" data-scene-backdrop></div>
        <div class="finale" data-finale aria-hidden="true">
          <div class="finale__flash" data-finale-flash></div>
          <p class="finale__line" data-finale-line aria-hidden="true">ששששש....</p>
          <p class="finale__line" data-finale-next aria-hidden="true">עכשיו אפשר ליצור</p>
        </div>
      </div>
      <!-- Future business content starts after the opening timeline. -->
      <div class="experience__content" data-content hidden>
        <section class="site-arrival" data-site-arrival>
          <img src="assets/logo/logo-ful.png" alt="שמואל שיף" data-site-logo>
        </section>
        <div class="site-body" data-site-body></div>
      </div>
      <header class="site-header" data-site-header>
        <img src="assets/logo/logo.png" alt="" data-site-header-logo>
      </header>

      <div class="intro">
        <span class="intro__dot" aria-hidden="true"></span>

        <div class="loader" data-loader-meter>
          <div
            class="loader__track"
            dir="ltr"
            role="progressbar"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
            aria-label="טעינה"
            data-loader-bar
          >
            <span class="loader__fill" data-loader-fill></span>
          </div>
          <p class="loader__percent" data-loader-percent dir="ltr">0%</p>
          <p class="loader__status" data-loader-status role="alert"></p>
        </div>

        <p class="scroll-hint" data-scroll-hint aria-hidden="true"></p>
      </div>
    </main>
    <script type="module" src="src/js/main.js"></script>
  </body>
</html>
